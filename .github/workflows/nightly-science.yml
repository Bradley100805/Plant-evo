name: Nightly science checks

# CI runs the statistical suite with one fixed seed. This job reruns it with fresh random seeds
# and more replicates, so a test that only passes for one lucky seed gets caught. A failure log
# prints the STATS_SEED needed to reproduce it locally.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    name: Statistical validation (random seed ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stats
        env:
          STATS_SEED: random
          STATS_SCALE: '2'
